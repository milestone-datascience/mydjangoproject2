{% extends 'layout.html' %}

{% block title %}
Post Page
{% endblock %}

{% block content %}
<h1>This is My Post Page</h1>
<p>This is the list of all the post</p>
<ul>
  {% for i in data %}
  <li>
    <h1>{{i.post_title}}</h1>
    <h2>{{i.description}}</h2>
  </li>
  {% endfor %}
</ul>
{% endblock %}
